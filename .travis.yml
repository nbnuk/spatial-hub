language: groovy
jdk:
- openjdk17
sudo: false
branches:
  only:
  - master
  - develop
addons:
  apt:
    packages:
    - gdal-bin
before_cache:
  - rm -f  $HOME/.gradle/caches/modules-2/modules-2.lock
  - rm -fr $HOME/.gradle/caches/*/plugin-resolution/
cache:
  directories:
    - $HOME/.m2
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/
before_install:
  - nvm install 15.5.0
  - npm -dd install
script:
  - echo "skipping tests"
  - ./gradlew war
after_success:
  - '[ "${TRAVIS_PULL_REQUEST}" = "false" ] && travis_retry ./gradlew publish'
env:
  global:
  - JAVA_TOOL_OPTIONS=-Dhttps.protocols=TLSv1.2
  - secure: 
  - secure: 
